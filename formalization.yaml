fidelity:
  divergences: >-
    Statements. The Challenge states the theorem in its standard local form, with these readings.
    The local stable set of f in U is the set of points whose forward orbit stays in U and tends
    to p; some texts omit the convergence, which follows for U inside a small enough ball. The
    local unstable set is the set of points with a backward orbit in U tending to p, which needs
    no inverse of f; for an invertible map it is the local stable set of the inverse (stated in
    the Challenge). The stable subspace is {v | A^k v -> 0} and the unstable subspace the set of
    vectors with a backward A-orbit tending to 0, which for invertible A is the stable subspace of
    A^-1 (stated in the Challenge); for hyperbolic A these are the sums of the generalized
    eigenspaces of the eigenvalues inside and outside the unit circle, which is not formalized.
    Hyperbolicity means that no complex root of the characteristic polynomial of A has modulus 1.
    The neighborhood U is given by the theorem, as in the textbook statement; the library proves
    the stable side for every neighborhood inside a small ball. The graph maps are C^n on
    neighborhoods of 0 (the construction makes them C^n on the whole subspace, which the library
    states for the stable side), and tangency is stated as the vanishing of their derivatives at
    0. Smoothness classes are C^n for n in
    {1, 2, ..., infinity}; the space is any finite-dimensional real normed space, the statement
    not depending on the norm.


    Proofs. The formalization follows the standard Lyapunov-Perron argument on bounded sequences
    rather than one text, and the texts were not compared with it line by line. It departs from
    the proofs of Hirsch, Pugh and Shub, and from fiber-contraction proofs, in how it gets
    smoothness: the bounded orbits solve x - L(phi o x) = (stable orbit of the initial stable
    component), with L the linear Lyapunov-Perron operator; the left side is a Lipschitz
    perturbation of the identity of the space of bounded sequences, and C^n because the
    composition operator x -> phi o x is C^n on bounded sequences in finite dimension, so its
    inverse is C^n; this is close to Irwin's 1970 proof with the implicit function theorem on a
    space of sequences. The unstable side is obtained as the stable side of the local inverse of
    f given by the inverse function theorem, rather than by a separate construction with backward
    orbits. The hyperbolic splitting is proved by factoring the characteristic polynomial over R
    into coprime factors with roots inside and outside the unit circle, with Gelfand's formula for
    the complexified matrix, rather than by the Jordan form or Riesz projections.

review:
  status: "unchecked"
  reviewers:
    - "none"
  notes: >-
    No person has reviewed the statements or the proofs. Lean's kernel checks the proofs, and
    Comparator, with Lean's kernel and the NanoDa kernel, checks that StableManifoldSolution.lean
    proves the statements of StableManifoldChallenge.lean using only propext, Classical.choice
    and Quot.sound.

alignment:
  namespace: "StableManifoldChallenge"
  statements:
    - source: "The stable manifold theorem at a hyperbolic fixed point (Irwin, Smooth Dynamical Systems, Chapter 6)"
      lean: "StableManifoldChallenge.stable_manifold"
      module: "StableManifoldChallenge"
      status: "proved"
      note: >-
        For f of class C^n (1 <= n <= infinity) near a fixed point p of a finite-dimensional real
        normed space, with invertible hyperbolic derivative A: an open neighborhood U of p and maps
        h_s : E_s -> E_u, h_u : E_u -> E_s, C^n near 0 and vanishing with their derivatives at 0,
        whose graphs p + x + h_s(x), p + y + h_u(y) over neighborhoods of 0 are the local stable
        and local unstable sets of f in U.
    - source: "The hyperbolic splitting of a hyperbolic linear map"
      lean: "StableManifoldChallenge.hyperbolic_splitting"
      module: "StableManifoldChallenge"
      status: "proved"
      note: >-
        For a linear map A of a finite-dimensional real normed space with no complex eigenvalue of
        modulus 1, the stable and unstable subspaces are complementary: E = E_s (+) E_u.
    - source: "The unstable subspace of an invertible linear map is the stable subspace of its inverse"
      lean: "StableManifoldChallenge.stableSubspace_symm"
      module: "StableManifoldChallenge"
      status: "proved"
      note: >-
        For a linear isomorphism e of a real normed space, {v | e^-k v -> 0} equals the set of
        vectors with a backward e-orbit tending to 0, the unstable subspace of e. It ties the
        definition of the unstable subspace to its usual form.
    - source: "The local unstable set of an invertible map is the local stable set of its inverse"
      lean: "StableManifoldChallenge.localStableSet_symm"
      module: "StableManifoldChallenge"
      status: "proved"
      note: >-
        For a homeomorphism e between open subsets of a topological space and a set U inside both,
        the local stable set of e^-1 in U equals the local unstable set of e in U. It ties the
        backward-orbit definition of the local unstable set to its usual form.

