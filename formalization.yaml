sources:
  - title: "Smooth Dynamical Systems"
    authors:
      - "M. C. Irwin"
    type: "book"
    location: "Academic Press, Pure and Applied Mathematics 94, 1980, Chapter 6 (Stable manifolds)"
    relationship: "formalizes"
    note: >-
      The stable manifold theorem at a hyperbolic fixed point of a diffeomorphism, in the
      textbook form formalized here: C^n local stable and unstable manifolds as graphs over the
      stable and unstable subspaces, tangent to them. The formal statement is for a map that is
      C^n near the fixed point with invertible derivative there (a local diffeomorphism). The
      formal proof follows the standard Lyapunov-Perron argument on bounded sequences, not one
      text, and was not compared with the book line by line.
    author_endorsement: "not-contacted"
  - title: "Sur l'itération et les solutions asymptotiques des équations différentielles"
    authors:
      - "Jacques Hadamard"
    type: "paper"
    location: "Bull. Soc. Math. France 29 (1901), 224-228"
    relationship: "background"
    note: >-
      A classical source of the theorem, by the method now called the graph transform, which the
      formalization does not use. Context only; not compared with the formalization.
    author_endorsement: "n/a"
  - title: "Über Stabilität und asymptotisches Verhalten der Lösungen eines Systems endlicher Differenzengleichungen"
    authors:
      - "Oskar Perron"
    id: "doi:10.1515/crll.1929.161.41"
    type: "paper"
    location: "J. Reine Angew. Math. 161 (1929), 41-64"
    relationship: "background"
    note: >-
      Perron's method for difference equations, the discrete setting of the formalization, whose
      proof is Perron's method on bounded sequences in its standard modern form. Not compared with
      the formalization line by line.
    author_endorsement: "n/a"
  - title: "Über Stabilität und asymptotisches Verhalten der Integrale von Differentialgleichungssystemen"
    authors:
      - "Oskar Perron"
    id: "doi:10.1007/BF01180524"
    type: "paper"
    location: "Math. Z. 29 (1929), 129-160"
    relationship: "background"
    note: >-
      Perron's method for differential equations (the Lyapunov-Perron method). Context only; flows
      are not formalized.
    author_endorsement: "n/a"
  - title: "On the Stable Manifold Theorem"
    authors:
      - "M. C. Irwin"
    id: "doi:10.1112/blms/2.2.196"
    type: "paper"
    location: "Bull. London Math. Soc. 2 (1970), 196-198"
    relationship: "background"
    note: >-
      A proof of the stable manifold theorem by the implicit function theorem on a space of
      sequences, the idea that the formalization uses for smoothness (the inverse function theorem
      on bounded sequences, with the smoothness of the composition operator). Not compared with
      the formalization line by line.
    author_endorsement: "not-contacted"
  - title: "Invariant Manifolds"
    authors:
      - "Morris W. Hirsch"
      - "Charles C. Pugh"
      - "Michael Shub"
    id: "doi:10.1007/BFb0092042"
    type: "book"
    location: "Lecture Notes in Mathematics 583, Springer, 1977"
    relationship: "background"
    note: >-
      The general theory of invariant manifolds, and the C^r section theorem, which the
      formalization replaces by the smoothness of the composition operator on bounded sequences.
      Context only.
    author_endorsement: "not-contacted"
  - title: "Global Stability of Dynamical Systems"
    authors:
      - "Michael Shub"
    id: "doi:10.1007/978-1-4757-1947-5"
    type: "book"
    location: "Springer, 1987"
    relationship: "background"
    note: >-
      A textbook account of the stable manifold theorem for hyperbolic fixed points. Context only;
      not compared with the formalization line by line.
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/TauCetiProject/TauCeti/blob/ca32605ff53921fa0689dd312618b7cfaafa7e43/TauCeti/Analysis/ODE/LyapunovPerron/VectorField.lean#L331"
    relationship: "independent"
    note: >-
      Lean 4 / Mathlib (TauCeti, Apache-2.0), concurrent: the stable and unstable manifold theorem
      for an equilibrium of a C^n vector field (a flow) in a finite-dimensional real normed space,
      assuming an exponential dichotomy of the linearization
      (ContinuousLinearMap.exists_localStableGraph_of_contDiffAt and
      exists_localUnstableGraph_of_contDiffAt, the latter at line 368; the vector-field theorem was
      first committed on 2026-11-06), by a Lyapunov-Perron contraction on bounded continuous curves
      and the implicit function theorem; also the continuous-time dichotomy from the absence of
      eigenvalues on the imaginary axis (ExponentialDichotomy/Hyperbolic.lean) and superposition
      operators on bounded continuous functions (FDeriv/BoundedContinuousFunction.lean). This work
      treats maps, assumes only hyperbolicity, and does not use or adapt that development.
  - id: "https://github.com/leanprover/lean-eval/blob/8955681b9914d7ebc7d286414843021b7d6c9de1/LeanEval/Dynamics/StableUnstableManifolds.lean#L51"
    relationship: "other"
    note: >-
      Lean 4 / Mathlib (lean-eval benchmark, Apache-2.0): a statement with sorry, without a public
      proof, of the set-level part of the theorem for a C1 map of R^n with invertible hyperbolic
      derivative at a fixed point: some open U containing the fixed point has local stable and
      unstable sets, defined as in this work, meeting only at the point. It does not state that
      they are manifolds. A copy is a wanted theorem in facebookresearch/atlas-lean
      (WantedExt/Dynamics/StableUnstableManifoldsWanted.lean at commit
      970aaf746442807f27e40b02f0e36d1098c53ad7). This work does not use or adapt it.
  - id: "https://github.com/Manzatto/conditioned-stochastic-stability-hyperbolic/blob/0cdb3050d873d931f9f522d60bf6521f7b3ef489/LeanShared/Dynamics/HyperbolicBackwardTransform.lean#L112"
    relationship: "independent"
    note: >-
      Lean 4 / Mathlib (Apache-2.0): a Lyapunov-Perron transform on bounded sequences for a split
      hyperbolic map with a Lipschitz perturbation, proved Lipschitz, used for shadowing; no
      stable manifold theorem. This work does not use or adapt it.
  - id: "https://github.com/Robertboy18/PDEAtlas/blob/64eb0329c66b121bf37cba88e58f1506b99002a2/PDE/Analysis/Evolution/ODE/InvariantGraph/Local.lean#L36"
    relationship: "independent"
    note: >-
      Lean 4 / Mathlib (PDEAtlas, Apache-2.0): a local C2 center manifold for a finite diagonal
      linear system with a smooth remainder, by a Lyapunov-Perron argument on weighted paths, and
      a discrete-time hyperbolic splitting in real Hilbert spaces through the Riesz projection
      (PDE/Analysis/Spectral/UnstableSplitting.lean, exists_unstable_splitting). This work does
      not use or adapt it.

status:
  scope: >-
    Formalized: the stable manifold theorem for a map that is C^n (1 <= n <= infinity) on a
    neighborhood of a fixed point of a finite-dimensional real normed space with invertible
    hyperbolic derivative, in graph form, for the local stable set and the local unstable set on
    one open neighborhood, with tangency to the stable and unstable subspaces; the stable side
    without invertibility, with one graph map for every neighborhood inside a small ball; the
    hyperbolic splitting E = E_s (+) E_u for a hyperbolic linear map, and the disjointness of the
    two subspaces for every linear map in finite dimension; Gelfand's formula for real operators
    in the form that a spectrum inside the open unit disk gives a power of norm < 1; exponential
    dichotomies; the linear Lyapunov-Perron operator and, in any real Banach space, the global
    stable manifold of a globally small Lipschitz perturbation of a linear map with an
    exponential dichotomy (bounded orbits as a Lipschitz graph, geometric decay, tangency);
    superposition operators on bounded sequences, and their C^n regularity in finite dimension.
    The Challenge states the stable manifold theorem (both sides), the hyperbolic splitting, and
    two facts that tie the backward-orbit definitions of the unstable subspace and of the local
    unstable set to the stable ones of the inverse. Not formalized: flows and vector fields;
    infinite-dimensional spaces for the smooth theorem; analytic or Holder regularity; global
    stable and unstable manifolds as injectively immersed submanifolds; dependence of the local
    manifolds on f; center and pseudo-hyperbolic manifolds; stable manifolds of hyperbolic sets;
    the Hartman-Grobman theorem.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

