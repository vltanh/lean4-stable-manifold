version: "v0.4"

project:
  name: "The stable manifold theorem for a hyperbolic fixed point of a smooth map, with the hyperbolic splitting"
  description: >-
    A Lean 4 / Mathlib proof of the stable manifold theorem for maps, in graph form. Let f be of
    class C^n, 1 <= n <= infinity, on a neighborhood of a fixed point p of a finite-dimensional
    real normed space E, with derivative A = Df(p) invertible and hyperbolic (no complex
    eigenvalue of modulus 1), and let E_s and E_u be the stable and unstable subspaces of A. Then
    there are an open neighborhood U of p and maps h_s : E_s -> E_u and h_u : E_u -> E_s, of class
    C^n near 0 and vanishing with their derivatives at 0, such that the local stable set of f in
    U (the points whose forward orbit stays in U and tends to p) is the graph {p + x + h_s(x)} of
    h_s over a neighborhood of 0 in E_s, and the local unstable set (the points with a backward
    orbit in U tending to p) is the graph {p + y + h_u(y)} of h_u over a neighborhood of 0 in
    E_u. The stable side is also proved without invertibility, with one h_s for every
    neighborhood inside a small ball around p. Also proved: the hyperbolic splitting E = E_s (+)
    E_u for a hyperbolic linear map of a finite-dimensional real space.


    The proof is Perron's method on the Banach space of bounded sequences. The splitting comes
    from a factorization of the characteristic polynomial and Gelfand's formula, and gives an
    exponential dichotomy. After a cut-off by a bump function, f is a globally small Lipschitz
    perturbation F of A near p; the bounded forward orbits of F are the fixed points of a
    contraction built from the Lyapunov-Perron operator, and form the graph of a Lipschitz map
    over E_s. Smoothness of every order comes at once, without the fiber contraction theorem: the
    composition operator x -> phi o x is C^n on bounded sequences when phi is, and the inverse
    function theorem on the space of bounded sequences makes the graph C^n. The unstable side is
    the stable side of the local inverse of f. No earlier formal proof of the theorem for maps was
    found; a concurrent Lean 4 development (TauCeti) proves stable and unstable manifolds for
    equilibria of vector fields.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

